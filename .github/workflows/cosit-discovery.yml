name: Descobrir decisões Cosit
on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'
permissions:
  contents: read
concurrency:
  group: cosit-discovery
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Coletar ementas oficiais (janela de 60 dias)
        run: node scripts/collect-cosit-abstracts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogo-cosit-${{ github.run_id }}
          path: data/cosit/candidates.json
